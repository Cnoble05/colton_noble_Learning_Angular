<form [formGroup]="modifyForm" (ngSubmit)="onSubmit()">
  <label for="id">ID</label>
  <input id="id" type="number" formControlName="id" appHoverHighlight="lightblue" >


  <label for="title">Title</label>
  <input id="title" type="text" formControlName="title" appHoverHighlight="lightblue">


  <label for="price">Price</label>
  <input id="price" type="number" formControlName="price" appHoverHighlight="lightblue">



  <label for="genre">Genre</label>
  <input id="genre" type="text" formControlName="genre" appHoverHighlight="lightblue">


  <label for="yearOfRelease">Year of Release</label>
  <input id="yearOfRelease" type="number" formControlName="yearOfRelease" appHoverHighlight="lightblue">


  <button type="submit" appHoverHighlight="lightYellow">Submit</button>
  <button type="button" (click)="onDelete()" appHoverHighlight="lightcoral">Delete</button>
  <button type="button" (click)="onCreate()" appHoverHighlight="lightGreen">Create</button>


</form>
