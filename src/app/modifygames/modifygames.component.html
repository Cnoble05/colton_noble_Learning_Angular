<form [formGroup]="modifyForm" (ngSubmit)="onSubmit()">
  <label for="id">ID</label>
  <input id="id" type="number" formControlName="id">


  <label for="title">Title</label>
  <input id="title" type="text" formControlName="title">


  <label for="price">Price</label>
  <input id="price" type="number" formControlName="price">


  <label for="genre">Genre</label>
  <input id="genre" type="text" formControlName="genre">


  <label for="yearOfRelease">Year of Release</label>
  <input id="yearOfRelease" type="number" formControlName="yearOfRelease">


  <button type="submit">Submit</button>
  <button type = "button" (click)="onDelete()">Delete</button>
  <button type = "button" (click)="onCreate()">Create</button>


</form>
