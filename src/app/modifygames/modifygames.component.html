<form [formGroup]="modifyForm" (ngSubmit)="onSubmit()">
  <label for="id">ID</label>
  <input id="id" type="number" formControlName="id" appHoverHighlight="lightblue" >


  <label for="title">Title</label>
  <input id="title" type="text" formControlName="title" appHoverHighlight="lightblue">


  <label for="price">Price</label>
  <input id="price" type="number" formControlName="price" appHoverHighlight="lightblue">



  <label for="genre">Genre</label>
  <input id="genre" type="text" formControlName="genre" appHoverHighlight="lightblue">


  <label for="yearOfRelease">Year of Release</label>
  <input id="yearOfRelease" type="number" formControlName="yearOfRelease" appHoverHighlight="lightblue">

  <mat-checkbox class="checkbox">Have played?</mat-checkbox>


  <p>amount of hours played</p>

  <mat-radio-group formControlName="hoursPlayed">
    <mat-radio-button *ngFor="let option of hoursPlayedOptions" [value]="option.value">
      {{ option.viewValue }}
    </mat-radio-button>
  </mat-radio-group>





  <button type="submit" mat-raised-button appHoverHighlight="lightYellow">Submit</button>

  <button mat-raised-button color="warn" type="button" (click)="onDelete()">Delete</button>

  <button type="button" mat-raised-button  (click)="onCreate()" appHoverHighlight="lightGreen">Create</button>


</form>
