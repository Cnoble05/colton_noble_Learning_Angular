<form [formGroup]="modifyForm" (ngSubmit)="onSubmit()">

  <label for="id">ID</label>
  <input id="id" type="number" formControlName="id" appHoverHighlight="lightblue" matTooltip="Input Game's ID" >


  <label for="title">Title</label>
  <input id="title" type="text" formControlName="title" appHoverHighlight="lightblue"  matTooltip="Input New Game's Title">


  <label for="price">Price</label>
  <input id="price" type="number" formControlName="price" appHoverHighlight="lightblue"  matTooltip="Input New games price">



  <label for="genre">Genre</label>
  <input id="genre" type="text" formControlName="genre" appHoverHighlight="lightblue"  matTooltip="Input New Games Genre">


  <label for="yearOfRelease">Year of Release</label>
  <input id="yearOfRelease" type="number" formControlName="yearOfRelease" appHoverHighlight="lightblue"  matTooltip="Input New Games Year of Release">

  <mat-checkbox class="checkbox"  matTooltip="Have you played this game?" >Have played?</mat-checkbox>


  <p>amount of hours played</p>

  <mat-radio-group formControlName="hoursPlayed">
    <mat-radio-button *ngFor="let option of hoursPlayedOptions" [value]="option.value">
      {{ option.viewValue }}
    </mat-radio-button>
  </mat-radio-group>




  <button type="submit" mat-raised-button color="primary"  matTooltip="Override Game" >Submit</button>
  <button mat-raised-button color="warn" type="button"  matTooltip="Delete Game" (click)="onDelete() ">Delete</button>
  <button type="button" mat-raised-button color="accent"  matTooltip="Create New Game" (click)="onCreate()">Create</button>


</form>
